version: "3.7"

services:
  server:
    build: ./server
    # TODO Figure out how to install in system-level python
    command: /root/.poetry/bin/poetry run python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./server/:/usr/src/server/
    ports:
      - 8000:8000
    env_file:
      - ./.env.dev

  db:
    image: postgres:12.0-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=hello_django
      - POSTGRES_PASSWORD=hello_django
      - POSTGRES_DB=hello_django_dev

volumes:
  postgres_data:
