[tool.poetry]
name = "taps-backend"
version = "0.1.0"
description = ""
authors = ["Dillon Kerr <dillon.p.kerr@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
django = ">=5.1.6,<6.0.0"
graphene-django = ">=3.2.2,<4.0.0"
psycopg2-binary = ">=2.9.10,<3.0.0"
django-environ = ">=0.12.0,<0.13.0"
django-cors-headers = ">=4.7.0,<5.0.0"
django-allow-cidr = ">=0.7.0,<1.0.0"
gunicorn = ">=23.0.0,<24.0.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
ruff = "^0.12.9"

[tool.ruff]
# Exclude common Django directories
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    ".venv",
    "node_modules",
]

# Same as Black
line-length = 88

# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default
lint.select = ["E", "F", "W", "I", "N", "DJ"]

# Django-specific rules
[tool.ruff.lint.per-file-ignores]
"*/settings*.py" = ["E501"]  # Allow long lines in settings files
"*/migrations/*.py" = ["E501", "F401"]  # Relax rules for migrations
