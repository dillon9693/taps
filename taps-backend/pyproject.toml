[tool.poetry]
name = "taps-backend"
version = "0.1.0"
description = ""
authors = ["Dillon Kerr <dillon.p.kerr@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
django = ">=5.1.6,<6.0.0"
graphene-django = ">=3.2.2,<4.0.0"
psycopg2-binary = ">=2.9.10,<3.0.0"
django-environ = ">=0.12.0,<0.13.0"
django-cors-headers = ">=4.7.0,<5.0.0"
gunicorn = ">=23.0.0,<24.0.0"
django-allauth = {version = ">=65.5.0,<66.0.0", extras = ["socialaccount"]}
whitenoise = "^6.11.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
ruff = "^0.12.9"
mypy = "^1.18.2"
django-stubs = {extras = ["compatible-mypy"], version = "^5.2.7"}
types-requests = "^2.32.4.20250913"

[tool.ruff]
# Exclude common Django directories
exclude = [
    ".git",
    "__pycache__",
    "migrations",
    ".venv",
    "node_modules",
]

# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default
lint.select = ["E", "F", "W", "I", "N", "DJ"]

# Django-specific rules
[tool.ruff.lint.per-file-ignores]
"*/settings*.py" = ["E501"]  # Allow long lines in settings files
"*/migrations/*.py" = ["E501", "F401"]  # Relax rules for migrations

[tool.mypy]
# Mypy configuration for gradual type adoption
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

# Gradual adoption settings - can tighten these later
allow_untyped_calls = true
allow_incomplete_defs = false

# Django-specific settings
[tool.django-stubs]
django_settings_module = "taps_backend.settings"

[[tool.mypy.overrides]]
# Exclude migrations from type checking
module = "*.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
# Third-party libraries without stubs
module = [
    "graphene",
    "graphene_django.*",
    "graphql.*",
    "environ",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test files - less strict checking
module = [
    "taps.tests",
    "taps.test_decorators",
    "taps.test_queries",
]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Settings and config files - less strict
module = [
    "taps_backend.settings",
    "taps_backend.development_settings",
    "taps_backend.production_settings",
    "taps.apps",
]
disallow_untyped_defs = false
